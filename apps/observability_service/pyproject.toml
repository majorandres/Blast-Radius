[project]
name = "observability-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "blastradius-contracts",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1"]

[tool.uv.sources]
blastradius-contracts = { path = "../../packages/contracts" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests"]
testpaths = ["tests"]
markers = ["slow: drives a live scenario end to end; takes minutes"]
