[project]
name = "blastradius-contracts"
version = "0.1.0"
description = "Cross-process contracts for Blast Radius: span envelope and attribute keys."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blastradius_contracts"]
